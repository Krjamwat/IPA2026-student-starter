# ==============================================================================
# Ansible Inventory Configuration
# ทำไมต้องตั้งค่า network_cli และดึง Credentials จาก Environment:
# 1. ansible_connection=ansible.netcommon.network_cli ใช้สื่อสารกับ Cisco IOS ผ่าน CLI SSH
# 2. ansible_host={{ router }} รับ IP ปลายทางแบบ Dynamic จากตัวแปรที่ส่งเข้ามา
# 3. ใช้ lookup('env', ...) ดึง User/Pass จาก Environment เพื่อความปลอดภัย ไม่ฮาร์ดโค้ดรหัสผ่าน
# ==============================================================================
# ==============================================================================
# Ansible Inventory Configuration
# ทำไมต้องตั้งค่า network_cli และดึง Credentials จาก Environment:
# 1. ansible_connection=ansible.netcommon.network_cli ใช้สื่อสารกับ Cisco IOS ผ่าน CLI SSH
# 2. ansible_host={{ router }} รับ IP ปลายทางแบบ Dynamic จากตัวแปรที่ส่งเข้ามา
# 3. ใช้ lookup('env', ...) ดึง User/Pass จาก Environment เพื่อความปลอดภัย ไม่ฮาร์ดโค้ดรหัสผ่าน
# ==============================================================================
[routers]
target

[routers:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_host={{ router }}
ansible_user={{ lookup('env', 'ROUTER_USER') }}
ansible_password={{ lookup('env', 'ROUTER_PASS') }}
